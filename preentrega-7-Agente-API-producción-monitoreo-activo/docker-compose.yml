# docker-compose.yml
# ===================
#
# Levanta Redis (obligatorio) y, opcionalmente, Phoenix (el dashboard de
# observabilidad gratis/self-hosted) y la API misma.
#
# Uso típico mientras desarrollás (Redis + Phoenix en Docker, la API
# corriendo local con `uvicorn app.main:app --reload` para iterar rápido):
#
#     docker compose up -d redis phoenix
#     uvicorn app.main:app --reload
#
# Uso "todo en contenedores" (para probar el deploy completo, o para la
# prueba de carga de 5 pedidos concurrentes):
#
#     docker compose up -d --build
#
# En ambos casos, el dashboard de Phoenix queda en http://localhost:6006.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # dashboard + endpoint OTLP http (recibe las trazas)
      - "4317:4317" # endpoint OTLP grpc (no se usa en esta app, pero no molesta tenerlo)

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dentro de la red de docker-compose, los servicios se resuelven por
      # nombre (no "localhost") -- se pisan acá las variables del .env
      # para que apunten a los contenedores de al lado.
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  redis_data:
